<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, set, get, onValue, push, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAr6tZyeiMZS_JkSjI66FLtmma6Hx8mxDs",
    authDomain: "velocoin-66ed2.firebaseapp.com",
    projectId: "velocoin-66ed2",
    storageBucket: "velocoin-66ed2.firebasestorage.app",
    messagingSenderId: "943947327347",
    appId: "1:943947327347:web:f19ff29d589e89ed9e8706",
    measurementId: "G-1T2Y1JKTJD"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window.currentUser = null;
  window.userProfile = null;
  let isCreatingAccount = false; // Flag to prevent auth listener race conditions

  const sanitize = (str) => String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  const greetings = [
    "Welcome back,", "Hello there,", "Good to see you,", "Great having you here,", 
    "Ready to flow,", "Your vault awaits,", "Greetings,"
  ];

  // Press Enter key handler mapping
  document.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
      const activeElement = document.activeElement;
      if (activeElement && activeElement.dataset.enter) {
        const fnName = activeElement.dataset.enter;
        if (typeof window[fnName] === 'function') {
          window[fnName]();
        }
      }
    }
  });

  window.switchView = (viewId) => {
    const activeView = document.querySelector('.view.active');
    const targetView = document.getElementById(viewId);

    if (activeView && activeView !== targetView) {
      activeView.style.opacity = '0';
      activeView.style.transform = 'translateY(12px) scale(0.99)';
      
      setTimeout(() => {
        activeView.classList.remove('active');
        targetView.classList.add('active');
        void targetView.offsetWidth;
        targetView.style.opacity = '1';
        targetView.style.transform = 'translateY(0) scale(1)';
      }, 200);
    } else if (!activeView) {
      targetView.classList.add('active');
      void targetView.offsetWidth;
      targetView.style.opacity = '1';
      targetView.style.transform = 'translateY(0) scale(1)';
    }

    document.querySelectorAll('.status-msg').forEach(el => el.innerText = '');
  };

  onAuthStateChanged(auth, async (user) => {
    // Skip auto-redirect if account creation is in progress
    if (isCreatingAccount) return;

    if (user) {
      window.currentUser = user;
      const snap = await get(ref(db, `users/${user.uid}`));
      if (snap.exists()) {
        window.userProfile = snap.val();
        const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
        document.getElementById('dash-greeting').innerText = `${randomGreeting} ${sanitize(window.userProfile.name)}`;
        document.getElementById('dash-wallet-id').innerText = `#${sanitize(window.userProfile.walletId)}`;
        
        attachDashboardListeners();
        switchView('view-dashboard');
      } else {
        switchView('view-landing');
      }
    } else {
      window.currentUser = null;
      window.userProfile = null;
      switchView('view-landing');
    }
  });

  window.executeLogin = async () => {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const pass = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    if (!email || !pass) { errEl.innerText = "Please enter credentials."; return; }
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      errEl.innerText = e.message.replace('Firebase:', '').trim();
    }
  };

  window.executeLogout = () => signOut(auth);

  let obStep = 1;
  const totalObSteps = 7;
  const stepMap = ['ob-step-1', 'ob-step-2', 'ob-step-3', 'ob-step-4', 'ob-step-5a', 'ob-step-5b', 'ob-step-5c'];

  window.nextOnboardingStep = async () => {
    const errEl = document.getElementById('ob-error');
    errEl.innerText = "";
    
    if (obStep === 1 && !document.getElementById('ob-email').value.trim()) return errEl.innerText = "Email required.";
    if (obStep === 2 && document.getElementById('ob-password').value.length < 6) return errEl.innerText = "Password must be 6+ chars.";
    if (obStep === 3 && !document.getElementById('ob-name').value.trim()) return errEl.innerText = "Name required.";
    
    if (obStep === 4) {
      const rawVal = document.getElementById('ob-wallet-id').value;
      const wid = String(rawVal).trim();
      
      if (!wid || wid.length < 1 || wid.length > 6 || !/^\d+$/.test(wid)) {
        return errEl.innerText = "Enter a 1 to 6 digit number.";
      }
      
      try {
        const snap = await get(ref(db, `walletIds/${wid}`));
        if (snap.exists()) return errEl.innerText = "Wallet ID already taken. Choose another.";
      } catch(e) {
        // Fallthrough if unauthenticated reads are restricted
      }
    }

    if (obStep < totalObSteps) {
      const curr = document.getElementById(stepMap[obStep-1]);
      const next = document.getElementById(stepMap[obStep]);

      curr.style.opacity = '0';
      curr.style.transform = 'translateX(-20px)';
      
      setTimeout(() => {
        curr.classList.remove('active');
        next.classList.add('active');
        void next.offsetWidth;
        next.style.opacity = '1';
        next.style.transform = 'translateX(0)';
        
        const nextInput = next.querySelector('input, select');
        if (nextInput) nextInput.focus();
      }, 200);

      obStep++;
      document.getElementById('onboarding-indicator').innerText = `Step ${obStep <= 4 ? obStep : 5} of 5`;
      
      if (obStep === totalObSteps) {
        document.getElementById('ob-next-btn').innerText = "Create Account";
      }
    } else {
      executeRegistration();
    }
  };

  window.prevOnboardingStep = () => {
    if (obStep > 1) {
      document.getElementById('ob-error').innerText = "";
      const curr = document.getElementById(stepMap[obStep-1]);
      const prev = document.getElementById(stepMap[obStep-2]);

      curr.style.opacity = '0';
      curr.style.transform = 'translateX(20px)';
      
      setTimeout(() => {
        curr.classList.remove('active');
        prev.classList.add('active');
        void prev.offsetWidth;
        prev.style.opacity = '1';
        prev.style.transform = 'translateX(0)';
      }, 200);

      obStep--;
      document.getElementById('onboarding-indicator').innerText = `Step ${obStep <= 4 ? obStep : 5} of 5`;
      document.getElementById('ob-next-btn').innerText = "Continue";
    } else {
      switchView('view-landing');
    }
  };

  async function executeRegistration() {
    const errEl = document.getElementById('ob-error');
    const email = document.getElementById('ob-email').value.trim().toLowerCase();
    const pass = document.getElementById('ob-password').value;
    const name = sanitize(document.getElementById('ob-name').value.trim());
    const wid = String(document.getElementById('ob-wallet-id').value).trim();
    
    const prefReq = document.getElementById('ob-pref-request').value;
    const prefSend = document.getElementById('ob-pref-send').value;
    const prefDep = document.getElementById('ob-pref-deposit').value;

    document.getElementById('ob-next-btn').innerText = "Creating Vault...";
    isCreatingAccount = true; // Block auth listener from interrupting

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const uid = cred.user.uid;
      
      const profileData = {
        email, name, walletId: wid,
        preferences: { sendRequests: prefReq, sendMoney: prefSend, depositMode: prefDep, approvedIds: "" }
      };

      // Ensure all database writes finish first
      await Promise.all([
        set(ref(db, `users/${uid}`), profileData),
        set(ref(db, `walletIds/${wid}`), { uid: uid }),
        set(ref(db, `balances/${uid}`), 100)
      ]);

      window.currentUser = cred.user;
      window.userProfile = profileData;

      document.getElementById('dash-greeting').innerText = `${greetings[0]} ${sanitize(profileData.name)}`;
      document.getElementById('dash-wallet-id').innerText = `#${sanitize(profileData.walletId)}`;

      attachDashboardListeners();
      isCreatingAccount = false;
      switchView('view-dashboard');

    } catch(e) {
      isCreatingAccount = false;
      errEl.innerText = e.message.replace('Firebase:', '').trim();
      document.getElementById('ob-next-btn').innerText = "Create Account";
    }
  }

  function attachDashboardListeners() {
    const uid = window.currentUser.uid;
    
    onValue(ref(db, `balances/${uid}`), snap => {
      const bal = snap.val() || 0;
      document.getElementById('dash-balance').innerText = bal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    });

    onValue(ref(db, `transactions`), snap => {
      const data = snap.val();
      const listEl = document.getElementById('tx-list');
      if (!data) {
        listEl.innerHTML = `<div style="color:var(--text-muted); padding: 12px 0;">No activity yet.</div>`;
        return;
      }
      
      const txs = Object.values(data).filter(t => t.fromUid === uid || t.toUid === uid);
      txs.sort((a,b) => b.timestamp - a.timestamp);
      
      if (txs.length === 0) {
        listEl.innerHTML = `<div style="color:var(--text-muted); padding: 12px 0;">No activity yet.</div>`;
        return;
      }

      listEl.innerHTML = "";
      txs.slice(0, 15).forEach(tx => {
        const isOutgoing = tx.fromUid === uid;
        const amtColorClass = isOutgoing ? "tx-out" : "tx-in";
        const sign = isOutgoing ? "-" : "+";
        const title = isOutgoing ? `Sent to #${sanitize(tx.toWalletId)}` : (tx.type === 'request' ? `Requested from #${sanitize(tx.fromWalletId)}` : `Received from #${sanitize(tx.fromWalletId)}`);
        const dateStr = new Date(tx.timestamp).toLocaleDateString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});

        listEl.innerHTML += `
          <div class="tx-item">
            <div class="tx-info">
              <span class="tx-title">${title}</span>
              <span class="tx-date">${dateStr}</span>
            </div>
            <span class="tx-amt ${amtColorClass}">${sign}${tx.amount.toLocaleString('en-US', {minimumFractionDigits: 2})} $VLC</span>
          </div>
        `;
      });
    });

    if (window.userProfile.preferences.depositMode === 'manual_accept') {
      document.getElementById('pending-section').style.display = 'block';
      onValue(ref(db, `pendingTransfers/${uid}`), snap => {
        const data = snap.val();
        const listEl = document.getElementById('pending-list');
        if (!data) {
          listEl.innerHTML = `<div style="color:var(--text-muted); font-size:0.9rem;">No pending transfers.</div>`;
          return;
        }
        
        listEl.innerHTML = "";
        Object.keys(data).forEach(txKey => {
          const tx = data[txKey];
          listEl.innerHTML += `
            <div class="tx-item">
              <div class="tx-info">
                <span class="tx-title">Incoming from #${sanitize(tx.fromWalletId)}</span>
                <span class="tx-date">${tx.amount} $VLC</span>
              </div>
              <div style="display:flex; gap:8px;">
                <button style="padding:8px 14px; font-size:0.8rem; background:var(--incoming);" onclick="resolvePending('${txKey}', true)">Accept</button>
                <button style="padding:8px 14px; font-size:0.8rem; background:var(--surface-subtle); color:var(--text-main); box-shadow:none;" onclick="resolvePending('${txKey}', false)">Decline</button>
              </div>
            </div>
          `;
        });
      });
    } else {
      document.getElementById('pending-section').style.display = 'none';
    }
  }

  window.loadSettings = () => {
    document.getElementById('set-name').value = window.userProfile.name;
    document.getElementById('set-req').value = window.userProfile.preferences.sendRequests;
    document.getElementById('set-send').value = window.userProfile.preferences.sendMoney;
    document.getElementById('set-deposit').value = window.userProfile.preferences.depositMode;
    document.getElementById('set-approved').value = window.userProfile.preferences.approvedIds || "";
    document.getElementById('set-status').innerText = "";
    switchView('view-settings');
  };

  window.saveSettingsAndExit = async () => {
    const uid = window.currentUser.uid;
    const newName = sanitize(document.getElementById('set-name').value.trim());
    const prefs = {
      sendRequests: document.getElementById('set-req').value,
      sendMoney: document.getElementById('set-send').value,
      depositMode: document.getElementById('set-deposit').value,
      approvedIds: document.getElementById('set-approved').value.replace(/\s+/g, '')
    };
    
    window.userProfile.name = newName;
    window.userProfile.preferences = prefs;
    
    await update(ref(db, `users/${uid}`), { name: newName, preferences: prefs });
    
    document.getElementById('dash-greeting').innerText = `${greetings[0]} ${newName}`;
    attachDashboardListeners();
    
    switchView('view-dashboard');
  };

  let actionType = 'send';
  let targetUserData = null;

  window.openActionModal = (type) => {
    actionType = type;
    document.getElementById('action-title-indicator').innerText = type === 'send' ? "Send $VLC" : "Request $VLC";
    document.getElementById('act-target-id').value = "";
    document.getElementById('act-amount').value = "";
    document.getElementById('act-error').innerText = "";
    
    document.querySelectorAll('#view-action .step-container').forEach(el => el.classList.remove('active'));
    const step1 = document.getElementById('act-step-1');
    step1.classList.add('active');
    step1.style.opacity = '1';
    step1.style.transform = 'translateX(0)';
    
    switchView('view-action');
  };

  window.validateTargetAndProceed = async () => {
    const wid = String(document.getElementById('act-target-id').value).trim();
    const errEl = document.getElementById('act-error');
    errEl.innerText = "";

    if (!wid || wid === window.userProfile.walletId) {
      return errEl.innerText = "Enter a valid distinct Wallet ID.";
    }

    const snap = await get(ref(db, `walletIds/${wid}`));
    if (!snap.exists()) return errEl.innerText = "Wallet ID not found.";
    
    const targetUid = snap.val().uid;
    const userSnap = await get(ref(db, `users/${targetUid}`));
    
    if (userSnap.exists()) {
      targetUserData = { uid: targetUid, walletId: wid, ...userSnap.val() };
      
      const myId = window.userProfile.walletId;
      const tPrefs = targetUserData.preferences;
      
      if (actionType === 'send') {
        if (tPrefs.sendMoney === 'no_one') return errEl.innerText = "This user does not accept incoming transfers.";
        if (tPrefs.sendMoney === 'approved_ids' && !tPrefs.approvedIds.split(',').includes(myId)) {
          return errEl.innerText = "You are not on their approved senders list.";
        }
      } else {
        if (tPrefs.sendRequests === 'no_one') return errEl.innerText = "This user does not accept requests.";
        if (tPrefs.sendRequests === 'approved_ids' && !tPrefs.approvedIds.split(',').includes(myId)) {
          return errEl.innerText = "You are not on their approved requesters list.";
        }
      }

      document.getElementById('act-target-name-display').innerText = `Target: ${sanitize(targetUserData.name)} (#${wid})`;
      
      const step1 = document.getElementById('act-step-1');
      const step2 = document.getElementById('act-step-2');
      
      step1.style.opacity = '0';
      step1.style.transform = 'translateX(-20px)';
      setTimeout(() => {
        step1.classList.remove('active');
        step2.classList.add('active');
        void step2.offsetWidth;
        step2.style.opacity = '1';
        step2.style.transform = 'translateX(0)';
        document.getElementById('act-amount').focus();
      }, 200);
    }
  };

  window.executeAction = async () => {
    const amt = parseFloat(document.getElementById('act-amount').value);
    const errEl = document.getElementById('act-error');
    errEl.innerText = "";
    
    if (isNaN(amt) || amt <= 0) return errEl.innerText = "Enter a valid amount.";

    const myUid = window.currentUser.uid;

    if (actionType === 'send') {
      const senderRef = ref(db, `balances/${myUid}`);
      let txSuccess = false;

      try {
        await runTransaction(senderRef, (currentBalance) => {
          if ((currentBalance || 0) >= amt) {
            txSuccess = true;
            return currentBalance - amt;
          }
          txSuccess = false;
          return currentBalance; 
        });

        if (!txSuccess) return errEl.innerText = "Insufficient balance.";

        if (targetUserData.preferences.depositMode === 'manual_accept') {
          await push(ref(db, `pendingTransfers/${targetUserData.uid}`), {
            fromUid: myUid, fromWalletId: window.userProfile.walletId, amount: amt, timestamp: Date.now()
          });
          showActionSuccess(`Sent ${amt} $VLC. Awaiting recipient acceptance.`);
        } else {
          await runTransaction(ref(db, `balances/${targetUserData.uid}`), (curr) => (curr || 0) + amt);
          
          await push(ref(db, 'transactions'), {
            fromUid: myUid, fromWalletId: window.userProfile.walletId,
            toUid: targetUserData.uid, toWalletId: targetUserData.walletId,
            amount: amt, type: 'transfer', timestamp: Date.now()
          });
          
          showActionSuccess(`Successfully sent ${amt} $VLC!`);
        }

      } catch(e) {
        errEl.innerText = "Transfer failed: " + e.message;
      }
    } else {
      await push(ref(db, 'transactions'), {
        fromUid: targetUserData.uid, fromWalletId: targetUserData.walletId,
        toUid: myUid, toWalletId: window.userProfile.walletId,
        amount: amt, type: 'request', timestamp: Date.now()
      });
      showActionSuccess(`Request for ${amt} $VLC sent.`);
    }
  };

  function showActionSuccess(msg) {
    const step2 = document.getElementById('act-step-2');
    const step3 = document.getElementById('act-step-3');
    
    step2.style.opacity = '0';
    step2.style.transform = 'translateX(-20px)';
    
    setTimeout(() => {
      step2.classList.remove('active');
      step3.classList.add('active');
      void step3.offsetWidth;
      step3.style.opacity = '1';
      step3.style.transform = 'translateX(0)';
      document.getElementById('act-success-msg').innerText = msg;
    }, 200);
  }

  window.resolvePending = async (txKey, isAccept) => {
    const uid = window.currentUser.uid;
    const txRef = ref(db, `pendingTransfers/${uid}/${txKey}`);
    const snap = await get(txRef);
    if (!snap.exists()) return;
    
    const txData = snap.val();

    if (isAccept) {
      await runTransaction(ref(db, `balances/${uid}`), (curr) => (curr || 0) + txData.amount);
      await push(ref(db, 'transactions'), {
        fromUid: txData.fromUid, fromWalletId: txData.fromWalletId,
        toUid: uid, toWalletId: window.userProfile.walletId,
        amount: txData.amount, type: 'transfer', timestamp: Date.now()
      });
    } else {
      await runTransaction(ref(db, `balances/${txData.fromUid}`), (curr) => (curr || 0) + txData.amount);
    }
    
    await remove(txRef);
  };
</script>
