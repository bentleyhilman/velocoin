<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wallet Transfer</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --error: #dc2626;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 32px;
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow: hidden;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
      font-weight: 500;
    }

    .header-actions button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
    }

    .header-actions button:hover {
      color: var(--text-main);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .step-container {
      position: relative;
    }

    .step {
      display: none;
      transition: all 0.2s ease-in-out;
    }

    .step.active {
      display: block;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      background-color: #f9fafb;
    }

    .input-field:focus {
      border-color: var(--primary);
      background-color: #fff;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .error-msg {
      color: var(--error);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    .target-display {
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-actions">
      <button onclick="window.location.reload()">← Cancel</button>
      <span id="action-title-header">Send $VLC</span>
    </div>

    <h2 class="title" id="main-title">Recipient Wallet ID</h2>
    <p class="subtitle" id="main-subtitle">Enter recipient's 1–6 digit ID.</p>

    <div class="step-container">
      <!-- Step 1: Lookup Target -->
      <div id="act-step-1" class="step active">
        <div class="input-group">
          <input type="number" id="act-target-id" class="input-field" placeholder="111112" />
        </div>
        <button class="btn-primary" onclick="validateTargetAndProceed()">Next</button>
      </div>

      <!-- Step 2: Enter Amount & Confirm -->
      <div id="act-step-2" class="step">
        <div id="act-target-name-display" class="target-display"></div>
        <div class="input-group">
          <input type="number" id="act-amount" class="input-field" placeholder="Amount ($VLC)" min="1" step="any" />
        </div>
        <button class="btn-primary" onclick="executeTransfer()">Confirm Transfer</button>
      </div>
    </div>

    <div id="act-error" class="error-msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      get, 
      query, 
      orderByChild, 
      equalTo, 
      runTransaction 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // TODO: Replace with your actual Firebase Web Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let targetUserData = null;
    let actionType = 'send'; // 'send' or 'request'

    // Helper sanitization
    const sanitize = (str) => {
      const d = document.createElement('div');
      d.innerText = str || '';
      return d.innerHTML;
    };

    // Listen to user auth state
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const userSnap = await get(ref(db, `users/${user.uid}`));
        if (userSnap.exists()) {
          window.userProfile = userSnap.val();
        }
      } else {
        document.getElementById('act-error').innerText = "Please log in to perform transfers.";
      }
    });

    // Step 1: Validate Target Wallet ID directly against /users
    window.validateTargetAndProceed = async () => {
      const wid = String(document.getElementById('act-target-id').value).trim();
      const errEl = document.getElementById('act-error');
      errEl.innerText = "";

      if (!wid) {
        return errEl.innerText = "Please enter a Wallet ID.";
      }

      if (window.userProfile && wid === window.userProfile.walletId) {
        return errEl.innerText = "You cannot send or request money from yourself.";
      }

      try {
        // Search the /users node for any child matching walletId === wid
        const usersRef = ref(db, 'users');
        const walletQuery = query(usersRef, orderByChild('walletId'), equalTo(wid));
        const snap = await get(walletQuery);

        if (!snap.exists()) {
          return errEl.innerText = "Wallet ID not found.";
        }

        // Extract target user details from snapshot query result
        const val = snap.val();
        const targetUid = Object.keys(val)[0];
        const targetData = val[targetUid];

        targetUserData = { uid: targetUid, ...targetData };

        const myId = window.userProfile ? window.userProfile.walletId : null;
        const tPrefs = targetUserData.preferences || {};

        if (actionType === 'send') {
          if (tPrefs.sendMoney === 'no_one') {
            return errEl.innerText = "This user does not accept incoming transfers.";
          }
          if (tPrefs.sendMoney === 'approved_ids' && (!tPrefs.approvedIds || !tPrefs.approvedIds.split(',').includes(myId))) {
            return errEl.innerText = "You are not on their approved senders list.";
          }
        } else {
          if (tPrefs.sendRequests === 'no_one') {
            return errEl.innerText = "This user does not accept requests.";
          }
          if (tPrefs.sendRequests === 'approved_ids' && (!tPrefs.approvedIds || !tPrefs.approvedIds.split(',').includes(myId))) {
            return errEl.innerText = "You are not on their approved requesters list.";
          }
        }

        // Render Step 2
        document.getElementById('act-target-name-display').innerText = `Target: ${sanitize(targetUserData.name)} (#${wid})`;
        document.getElementById('main-title').innerText = "Transfer Amount";
        document.getElementById('main-subtitle').innerText = "Specify the amount of $VLC to send.";

        const step1 = document.getElementById('act-step-1');
        const step2 = document.getElementById('act-step-2');

        step1.classList.remove('active');
        step2.classList.add('active');
        document.getElementById('act-amount').focus();

      } catch(e) {
        if (e.message.includes("PERMISSION_DENIED")) {
          errEl.innerText = "Error looking up user: Permission denied. Make sure database rules allow reading 'users'.";
        } else {
          errEl.innerText = "Error looking up user: " + e.message;
        }
      }
    };

    // Step 2: Execute Balance Transfer
    window.executeTransfer = async () => {
      const errEl = document.getElementById('act-error');
      const amountInput = document.getElementById('act-amount').value;
      const amount = parseFloat(amountInput);

      if (!amount || amount <= 0) {
        return errEl.innerText = "Please enter a valid amount greater than 0.";
      }

      if (!currentUser || !targetUserData) {
        return errEl.innerText = "Session expired or invalid recipient.";
      }

      const senderUid = currentUser.uid;
      const recipientUid = targetUserData.uid;

      try {
        const senderBalanceRef = ref(db, `balances/${senderUid}`);
        
        // Deduct from sender balance via atomic transaction
        const txnResult = await runTransaction(senderBalanceRef, (currentBalance) => {
          if (currentBalance === null || currentBalance < amount) {
            return; // Abort transaction if insufficient balance
          }
          return currentBalance - amount;
        });

        if (!txnResult.committed) {
          return errEl.innerText = "Insufficient balance to perform transaction.";
        }

        // Add to recipient balance
        const recipientBalanceRef = ref(db, `balances/${recipientUid}`);
        await runTransaction(recipientBalanceRef, (currentBalance) => {
          return (currentBalance || 0) + amount;
        });

        alert(`Successfully transferred ${amount} $VLC to ${targetUserData.name}!`);
        window.location.reload();

      } catch(e) {
        errEl.innerText = "Transfer failed: " + e.message;
      }
    };
  </script>
</body>
</html>
